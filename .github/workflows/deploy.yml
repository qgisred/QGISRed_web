name: Build and publish to deploy branch

# Compila el sitio estático y publica el contenido de out/ en la rama `deploy`.
# Plesk tiene el repositorio enganchado a esa rama en modo automático: recibe
# el webhook, hace pull y copia los ficheros al docroot. El servidor nunca
# ejecuta un build ni necesita Node.
#
# El transporte por FTPS no es viable: el cortafuegos de la UPV bloquea el
# rango de puertos pasivos, así que la conexión de datos muere con ECONNRESET.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sin NEXT_PUBLIC_BASE_PATH: el sitio vive en la raíz del subdominio.
      - name: Build static site
        run: npm run build

      - name: Publish out/ to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./out
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
