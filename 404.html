<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada – QGISRed</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/assets/img/logos/logoqgisred.png">
  <style>
    .error-page { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 48px 24px; }
    .error-code { font-size: 6rem; font-weight: 800; color: var(--color-accent); line-height: 1; }
    .error-msg  { font-size: 1.5rem; font-weight: 600; margin: 12px 0 8px; }
    .error-sub  { color: var(--color-text-muted); margin-bottom: 32px; }
  </style>
</head>
<body data-page="404" data-lang="es">
  <div id="site-header"></div>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <div class="error-msg">Página no encontrada</div>
      <p class="error-sub">La página que buscas no existe o ha sido movida.</p>
      <a href="/es/" class="btn btn-primary">Ir al inicio</a>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="/assets/js/components.js"></script>
</body>
</html>
